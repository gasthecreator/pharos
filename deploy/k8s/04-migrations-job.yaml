# One-shot Job applying Cassandra schema migrations and provisioning Kafka
# topics (§4, PLAN.md Slice 17: Deployment automation) -- the K8s
# equivalent of .github/workflows/ci.yml's "Apply Cassandra schema" /
# "Provision Kafka topics" steps, run once after Cassandra + Kafka report
# Ready rather than baked into any Deployment's own startup (both
# pharos-ingestion and pharos-consumer already bootstrap their own schemas
# on connect, per every earlier slice -- this Job only needs to create the
# keyspace/tables *before* those apps race to do it, avoiding "IF NOT
# EXISTS" ambiguity on which replication strategy wins first, exactly the
# same reasoning migrations/001_init_schema.cql's own header comment gives
# for CI).
apiVersion: batch/v1
kind: Job
metadata:
  name: pharos-migrations
  namespace: pharos
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: cassandra:5.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              for f in /migrations/*.cql; do
                echo "Applying $f"
                SSL_CERTFILE=/tls/ca-cert.pem cqlsh cassandra-us-0.cassandra.pharos.svc.cluster.local 9042 --ssl < "$f"
              done
          volumeMounts:
            - name: migrations
              mountPath: /migrations
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: pharos-migrations
        - name: tls
          secret:
            secretName: pharos-tls
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pharos-kafka-topics
  namespace: pharos
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: apache/kafka:3.8.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              BOOTSTRAP="kafka-a-0.kafka-a.pharos.svc.cluster.local:9092"
              CFG="--command-config /etc/kafka/secrets/client-ssl.properties"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" $CFG --create --if-not-exists \
                --topic pharos.events.adverse --partitions 3 --replication-factor 3 \
                --config retention.ms=604800000 --config retention.bytes=10737418240
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" $CFG --create --if-not-exists \
                --topic pharos.events.dlq --partitions 3 --replication-factor 3 \
                --config retention.ms=1209600000 --config retention.bytes=5368709120
          volumeMounts:
            - name: tls
              mountPath: /etc/kafka/secrets
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pharos-tls
            items:
              - key: kafka-truststore.jks
                path: kafka-truststore.jks
              - key: kafka-client-ssl.properties
                path: client-ssl.properties
