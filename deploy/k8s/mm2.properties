# MirrorMaker 2 configuration, K8s variant of kafka/mm2.properties (§2.4,
# PLAN.md Slice 17: Deployment automation) -- identical settings, only the
# bootstrap.servers hostnames differ (K8s StatefulSet pod DNS instead of
# Docker Compose container names). See kafka/mm2.properties for the full
# reasoning behind every other setting here.

clusters = dc-us, dc-eu

dc-us.bootstrap.servers = kafka-a-0.kafka-a.pharos.svc.cluster.local:19092,kafka-a-1.kafka-a.pharos.svc.cluster.local:19092,kafka-a-2.kafka-a.pharos.svc.cluster.local:19092
dc-eu.bootstrap.servers = kafka-b-0.kafka-b.pharos.svc.cluster.local:19092

dc-us->dc-eu.enabled = true
dc-eu->dc-us.enabled = false

topics = pharos\.events\.adverse|pharos\.events\.dlq
topics.exclude =
groups = .*

replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1

offset.storage.replication.factor = 1
config.storage.replication.factor = 1
status.storage.replication.factor = 1

tasks.max = 1

sync.topic.configs.enabled = true
refresh.topics.enabled = true
refresh.topics.interval.seconds = 30

sync.topic.configs.interval.seconds = 10
emit.heartbeats.interval.seconds = 5
emit.checkpoints.interval.seconds = 5
refresh.groups.interval.seconds = 10
