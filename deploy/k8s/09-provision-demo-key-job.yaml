# One-shot Job provisioning SITE-K8S-DEMO's API key entirely in-cluster
# (§2.4, PLAN.md Slice 17: Deployment automation) -- runs pharos-cli
# against Cassandra's in-cluster DNS name directly, so deploy.sh never
# needs a host-side `kubectl port-forward` just to run one admin command.
# deploy.sh greps the Job's own pod logs for the printed key and stores it
# in a Secret; the key itself is never written to this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: pharos-provision-demo-key
  namespace: pharos
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: pharos-provision-demo-key
    spec:
      restartPolicy: OnFailure
      securityContext:
        # Non-root, matching the image's numeric USER 65532 (deploy/docker/).
        # fsGroup makes mounted volumes (PVC, TLS Secret) group-readable by
        # that user without opening them to world.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pharos-cli
          image: pharos-cli:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--hosts=cassandra-us-0.cassandra.pharos.svc.cluster.local"
            - "--ca-cert=/tls/ca-cert.pem"
            - "site"
            - "create-key"
            - "SITE-K8S-DEMO"
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pharos-tls
            # Group-readable only (via fsGroup); the ingestion private key
            # must not be world-readable inside the pod.
            defaultMode: 0440
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
