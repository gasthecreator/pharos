# Downstream Consumer Deployment (§2.4, PLAN.md Slice 17: Deployment
# automation). Only 1 replica: the consumer group's own partition
# assignment (Slice 4) already handles multiple consumers correctly, but
# proving that in K8s specifically is Slice 19 (Multi-instance scaling)'s
# job, not this one's.
apiVersion: v1
kind: Service
metadata:
  name: pharos-consumer
  namespace: pharos
spec:
  selector:
    app: pharos-consumer
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharos-consumer
  namespace: pharos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharos-consumer
  template:
    metadata:
      labels:
        app: pharos-consumer
    spec:
      containers:
        - name: pharos-consumer
          image: pharos-consumer:local
          imagePullPolicy: IfNotPresent
          args:
            - "--cassandra-hosts=cassandra-us-0.cassandra.pharos.svc.cluster.local"
            - "--kafka-brokers=kafka-a-0.kafka-a.pharos.svc.cluster.local:9092"
            - "--ca-cert=/tls/ca-cert.pem"
            - "--metrics-port=9091"
          ports:
            - containerPort: 9091
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pharos-tls
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
