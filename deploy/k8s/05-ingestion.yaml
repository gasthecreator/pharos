# Central Ingestion Deployment (§2.4, PLAN.md Slice 17: Deployment
# automation). Liveness/readiness probes hit the real /healthz endpoint
# this service has exposed since Slice 6, exactly the same endpoint the
# Docker Compose healthchecks and CI use -- nothing K8s-specific about
# what "healthy" means here, only how it's checked.
apiVersion: v1
kind: Service
metadata:
  name: pharos-ingestion
  namespace: pharos
spec:
  selector:
    app: pharos-ingestion
  ports:
    - name: https
      port: 8443
      targetPort: 8443
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharos-ingestion
  namespace: pharos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharos-ingestion
  template:
    metadata:
      labels:
        app: pharos-ingestion
    spec:
      containers:
        - name: pharos-ingestion
          image: pharos-ingestion:local
          imagePullPolicy: IfNotPresent
          args:
            - "--port=8443"
            - "--cassandra-hosts=cassandra-us-0.cassandra.pharos.svc.cluster.local"
            - "--kafka-brokers=kafka-a-0.kafka-a.pharos.svc.cluster.local:9092"
            - "--ca-cert=/tls/ca-cert.pem"
            - "--tls-cert=/tls/ingestion-cert.pem"
            - "--tls-key=/tls/ingestion-key.pem"
            - "--enable-auth=true"
          ports:
            - containerPort: 8443
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pharos-tls
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
              - key: ingestion-cert.pem
                path: ingestion-cert.pem
              - key: ingestion-key.pem
                path: ingestion-key.pem
