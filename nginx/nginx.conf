# Load balancer for 2+ pharos-ingestion instances (§2.3, §2.4, PLAN.md
# Slice 19: Multi-instance scaling). TCP-level passthrough (the `stream`
# module), not HTTP reverse proxying with TLS termination here: ingestion
# already terminates its own TLS per-instance (Slice 15), and re-terminating
# at the LB would mean nginx needs its own copy of the project's private
# key -- passthrough keeps the TLS handshake and the client's certificate
# verification genuinely end-to-end to whichever instance actually serves
# the request, and needs no cert material at this layer at all.
#
# The two ingestion instances run as host processes (this project's
# existing convention -- see README's "Running it locally"), reachable
# from this container via host.docker.internal (Docker Desktop's bridge
# back to the host, already used the same way in
# observability/prometheus.yml).
events {
  worker_connections 1024;
}

stream {
  log_format basic '$remote_addr [$time_local] '
                    '$protocol $status $bytes_sent $bytes_received '
                    '$session_time "$upstream_addr" '
                    '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';
  access_log /dev/stdout basic;

  upstream pharos_ingestion {
    server host.docker.internal:8443;
    server host.docker.internal:8444;
  }

  server {
    listen 8500;
    proxy_pass pharos_ingestion;
  }
}
