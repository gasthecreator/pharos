<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{block "title" .}}Pharos{{end}}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; background: #f6f7f9; color: #1b1f24; }
    header { background: #14213d; color: #fff; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
    header a { color: #cdd7ff; text-decoration: none; font-size: 0.95rem; }
    header a:hover { color: #fff; text-decoration: underline; }
    header .brand { color: #fff; font-weight: 700; font-size: 1.1rem; margin-right: 1rem; }
    main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1.5rem 3rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .subtitle { color: #57606a; margin-top: 0; margin-bottom: 1.25rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid #e7eaed; font-size: 0.88rem; }
    th { background: #eef1f5; font-weight: 600; }
    tr:hover td { background: #fafbfc; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.78rem; font-weight: 600; }
    .badge-late { background: #fff3cd; color: #7a5c00; }
    .badge-published { background: #d7f0dc; color: #1a5c2a; }
    .badge-replayed { background: #d7e8f0; color: #14506b; }
    .badge-publishing { background: #e6e6e6; color: #555; }
    form.panel, .panel { background: #fff; border: 1px solid #e7eaed; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-top: 0.6rem; margin-bottom: 0.2rem; color: #333; }
    input[type=text], input[type=password], input[type=datetime-local], input[type=number], textarea, select {
      width: 100%; box-sizing: border-box; padding: 0.4rem 0.5rem; border: 1px solid #ccd1d6; border-radius: 4px; font-size: 0.9rem; font-family: inherit;
    }
    textarea { min-height: 8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
    button { margin-top: 0.9rem; background: #2054d6; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; font-size: 0.9rem; cursor: pointer; }
    button:hover { background: #1745ad; }
    button.danger { background: #b3261e; }
    button.danger:hover { background: #8f1e18; }
    .result-ok { border-left: 4px solid #1a5c2a; padding: 0.6rem 0.9rem; background: #f0fbf1; margin-bottom: 1rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.82rem; }
    .result-err { border-left: 4px solid #b3261e; padding: 0.6rem 0.9rem; background: #fdf0ef; margin-bottom: 1rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.82rem; }
    .empty { color: #777; font-style: italic; padding: 1rem 0; }
    .muted { color: #777; font-size: 0.82rem; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
    pre.payload { background: #f6f7f9; border: 1px solid #e7eaed; border-radius: 4px; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    .inline-form { display: inline-flex; gap: 0.4rem; align-items: center; }
    .inline-form input { width: auto; padding: 0.2rem 0.4rem; font-size: 0.8rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 200px; }
  </style>
</head>
<body>
<header>
  <span class="brand">Pharos</span>
  <a href="/">Recent Events</a>
  <a href="/query">Query</a>
  <a href="/dlq">DLQ</a>
  <a href="/submit">Submit Test Event</a>
  <a href="/chaos">Chaos Panel</a>
  {{if .GrafanaURL}}<a href="{{.GrafanaURL}}" target="_blank" rel="noopener">Grafana &rarr;</a>{{end}}
  {{if .Operator}}<span class="muted" style="margin-left:auto;color:#cdd7ff">Viewing as <strong style="color:#fff">{{.Operator}}</strong> &middot; <a href="/operator">switch</a></span>{{end}}
</header>
<main>
{{block "content" .}}{{end}}
</main>
</body>
</html>
