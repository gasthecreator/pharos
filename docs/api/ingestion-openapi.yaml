openapi: 3.0.3
info:
  title: Pharos Central Ingestion API
  version: "1.0"
  description: >
    The only service that talks to Kafka (PLAN.md §2.1). Its `/api/v1/events`
    endpoint is primarily an internal wire contract that edge collectors call
    — it is not intended for direct use by trial sites — but it's a real,
    independently addressable HTTP API, documented as such. Per-site rate
    limiting, FHIR validation, and dedup/outbox claim all happen here (§2.2,
    §2.3) before anything reaches Kafka.
servers:
  - url: http://localhost:8091
    description: Default local Central Ingestion instance (--port 8091; the README uses this port specifically to dodge a port-8081 conflict some machines have — see README.md)

security:
  - siteAuth: []

paths:
  /api/v1/events:
    post:
      summary: Submit a batch of adverse events from an edge collector
      description: >
        Per-event-aware batch semantics (PLAN.md §2.3) — a single batch can
        have a genuine mix of accepted, rejected, and transiently-failed
        events. 207 is returned whenever the batch has any mix of outcomes;
        a bare 503 is reserved for the case where every event in the batch
        hit an infrastructure failure with nothing else to report. Requires
        `X-Site-ID`/`X-API-Key` unless Central Ingestion runs with
        `--enable-auth=false` (PLAN.md §2.1, §2.2, Slice 15).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Every event in the batch was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "207":
          description: Multi-status — a mix of accepted/rejected/failed outcomes in one batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "422":
          description: Every event in the batch failed FHIR validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "429":
          description: Per-site rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
        "503":
          description: Every event in the batch hit an infrastructure failure (Cassandra/Kafka unavailable) — safe to retry the whole batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"

  /api/v1/dlq/{key}/replay:
    post:
      summary: Resubmit a rejected event's stored payload (PLAN.md §2.3, Slice 10)
      description: >
        Resubmits a DLQ'd record's stored raw payload through the exact same
        validation/claim/publish path a fresh submission uses — not a
        trust-it-now backdoor. Requires `X-Site-ID`/`X-API-Key` unless
        Central Ingestion runs with `--enable-auth=false`; the authenticated
        site must be the record's own owning site, or the call is rejected
        with 403 even if the credentials are otherwise valid (§2.1, §2.2,
        Slice 15). Every attempt — success or failure — is recorded in the
        durable access-audit trail (§2.4, Slice 20), surfaced via
        `pharos-cli audit list`.
      parameters:
        - name: key
          in: path
          required: true
          description: The rejected event's idempotency key (`<site_id>:<local_seq>`)
          schema:
            type: string
      responses:
        "200":
          description: Replay accepted and published to Kafka; the original DLQ record is marked REPLAYED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "207":
          description: Replay was accepted and published, but marking the original DLQ record REPLAYED itself failed (bookkeeping gap, not a data-loss one)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/EventResult"
                  warning:
                    type: string
        "400":
          description: Missing idempotency key in path
        "403":
          description: Authenticated site does not own this DLQ record
        "404":
          description: No DLQ record exists for this idempotency key
        "409":
          description: Record exists but is not in PUBLISHED status (already REPLAYED, or still mid-claim)
        "422":
          description: Replay still fails validation — the original DLQ record is left untouched and stays rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"
        "503":
          description: Replay hit an infrastructure failure (Cassandra/Kafka unavailable) — safe to retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResult"

  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up

  /metrics:
    get:
      summary: Prometheus metrics (request/status counts, rate-limit rejections, dedup outcomes, DLQ writes, outbox publish latency)
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    siteAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Paired with the X-Site-ID header (also required, but OpenAPI 3.0's
        apiKey scheme only models one header per scheme entry). The
        authenticated site must match X-Site-ID on every site-scoped route.
        Not enforced when Central Ingestion runs with --enable-auth=false
        (PLAN.md §2.1, §2.2, Slice 15).

  schemas:
    BatchRequest:
      type: object
      required: [events]
      properties:
        site_id:
          type: string
        events:
          type: array
          description: Raw FHIR-shaped adverse event JSON, forwarded byte-for-byte from the edge — see edge-openapi.yaml's AdverseEvent schema.
          items:
            type: object

    BatchResponse:
      type: object
      properties:
        total:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/EventResult"
        error:
          type: string

    EventResult:
      type: object
      properties:
        idempotency_key:
          type: string
        status:
          type: string
          enum: [ACCEPTED, REJECTED, FAILED]
        error:
          type: string
