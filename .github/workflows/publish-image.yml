# Builds every service's image, publishes it to GHCR, and signs it
# keylessly with cosign (Sigstore) -- closes
# docs/security-threat-model.md's "no image signing or provenance
# verification" gap. Also attaches an SBOM and SLSA provenance attestation
# via docker/build-push-action's own built-in support, so provenance is
# covered too, not just the signature.
#
# Two entry points:
#   - workflow_dispatch: exercise and verify the pipeline on demand without
#     waiting for a release. Publishes ghcr.io/<owner>/pharos-<service>:<short-sha>.
#   - workflow_call: from release.yml, which runs on `v*.*.*` tags. Because the
#     caller's ref is the tag, the same logic below additionally publishes
#     :<tag> and :latest. There is deliberately no direct `push: tags` trigger
#     here any more: it would publish the same release twice (once here, once
#     via release.yml).
name: Publish images

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign's keyless OIDC signing
    name: Build, push, and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [ingestion, consumer, edge, cli, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Docker image references require a lowercase repository name --
          # github.repository_owner may not be lowercase for every owner,
          # so lowercase it defensively rather than assuming.
          IMAGE="${REGISTRY}/${OWNER,,}/pharos-${SERVICE}"
          TAGS="${IMAGE}:$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${IMAGE}:${REF_TAG},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >>"${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >>"${GITHUB_OUTPUT}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the published image (keyless)
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # Release notes (release.yml) list every image by digest; the SBOM and
      # SLSA provenance are attached to each image as OCI attestations by
      # build-push-action (provenance: true, sbom: true).
      - name: Record the image digest
        run: |
          mkdir -p digests
          echo "${IMAGE}@${DIGEST}" > "digests/${SERVICE}.txt"
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.txt
          retention-days: 7
