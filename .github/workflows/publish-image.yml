# Builds every service's image, publishes it to GHCR, and signs it
# keylessly with cosign (Sigstore) -- closes
# docs/security-threat-model.md's "no image signing or provenance
# verification" gap. Also attaches an SBOM and SLSA provenance attestation
# via docker/build-push-action's own built-in support, so provenance is
# covered too, not just the signature.
#
# workflow_dispatch exists specifically so this can be exercised and
# verified on demand without waiting for the next tagged release -- the
# tag trigger is what a real release actually uses. Manual runs publish to
# ghcr.io/<owner>/pharos-<service>:<short-sha>; tag pushes additionally
# publish :<tag> and :latest.
name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign's keyless OIDC signing
    name: Build, push, and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [ingestion, consumer, edge, cli, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Docker image references require a lowercase repository name --
          # github.repository_owner may not be lowercase for every owner,
          # so lowercase it defensively rather than assuming.
          IMAGE="${REGISTRY}/${OWNER,,}/pharos-${SERVICE}"
          TAGS="${IMAGE}:$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${IMAGE}:${REF_TAG},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >>"${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >>"${GITHUB_OUTPUT}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the published image (keyless)
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
