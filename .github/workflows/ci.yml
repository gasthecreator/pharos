name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Vet, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: go build
        run: go build ./...

  test:
    name: Test against real Cassandra + Kafka
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Bring up the multi-node stack
        run: docker compose up -d

      - name: Wait for Cassandra + Kafka to report healthy
        run: |
          containers="pharos-cassandra-1 pharos-cassandra-2 pharos-cassandra-3 pharos-kafka-1 pharos-kafka-2 pharos-kafka-3"
          for i in $(seq 1 60); do
            all_healthy=true
            for c in $containers; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || echo "missing")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
              fi
            done
            if [ "$all_healthy" = true ]; then
              echo "Cluster is healthy."
              exit 0
            fi
            echo "Still waiting ($i/60)..."
            sleep 10
          done
          echo "Cluster did not become healthy in time."
          docker compose ps
          docker compose logs --tail 50
          exit 1

      - name: Apply Cassandra schema
        run: |
          for f in migrations/*.cql; do
            echo "Applying $f"
            docker exec -i pharos-cassandra-1 cqlsh 127.0.0.1 9042 < "$f"
          done

      - name: Provision Kafka topics
        run: ./scripts/create_topics.sh

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
