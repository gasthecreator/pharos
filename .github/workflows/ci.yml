name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Vet, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: go build
        run: go build ./...

  # Static + build-time checks for the hardening in deploy/ (non-root images,
  # schema-valid manifests). Runs on the GitHub runner because these need a
  # Docker daemon; scratch images have no shell, so `docker run` cannot
  # inspect them from the inside -- the image config is asserted instead.
  container-hardening:
    name: Container hardening
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Dockerfile base images are digest-pinned
        run: |
          if grep -n '^FROM ' deploy/docker/Dockerfile.* | grep -v 'scratch' | grep -v '@sha256:'; then
            echo "FROM line above is not pinned by digest"; exit 1
          fi

      - name: Build every image and assert it runs as non-root
        run: |
          for svc in ingestion consumer edge cli dashboard; do
            docker build -q -f "deploy/docker/Dockerfile.${svc}" -t "pharos-${svc}:ci" .
            user=$(docker inspect --format '{{.Config.User}}' "pharos-${svc}:ci")
            echo "pharos-${svc}: USER=${user}"
            if [ "$user" != "65532:65532" ]; then
              echo "pharos-${svc} does not run as 65532:65532"; exit 1
            fi
          done

      - name: Validate Kubernetes manifests (kubeconform)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.30.0 deploy/k8s/*.yaml

      - name: Pod securityContext is set on every Go-service workload
        run: |
          for f in 05-ingestion 06-consumer 07-edge 09-provision-demo-key-job 10-dashboard; do
            for k in "runAsNonRoot: true" "allowPrivilegeEscalation: false" "readOnlyRootFilesystem: true" "RuntimeDefault"; do
              grep -q "$k" "deploy/k8s/${f}.yaml" || { echo "deploy/k8s/${f}.yaml missing: $k"; exit 1; }
            done
          done

  test:
    name: Test against real Cassandra + Kafka
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      # generate_certs.sh needs `keytool` (to build Cassandra/Kafka's JKS
      # keystores/truststores) -- ubuntu-latest doesn't guarantee a JDK on
      # PATH without this.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      # certs/ is gitignored (private keys must never be committed), so a
      # fresh checkout has none -- generate the project CA and every
      # service cert/keystore before anything mounts them (§2.4,
      # ARCHITECTURE_PROPOSALS.md "Slice 15: Auth & TLS").
      - name: Generate TLS materials
        run: ./scripts/generate_certs.sh

      # Cassandra and Kafka come up first, deliberately *without*
      # mirrormaker (§2.4, Slice 14: Multi-Region Cassandra + Kafka) --
      # starting it before any topic exists means it immediately busy-loops
      # retrying against nonexistent topics, piling CPU contention on top of
      # 10 other JVMs' own startup work. Confirmed by hand this isn't
      # hypothetical: that exact sequencing produced two genuine OOM kills
      # (docker inspect: OOMKilled=true) even with headroom that looked fine
      # in a calm, already-settled snapshot -- CPU starvation delays GC,
      # which lets RSS balloon before it can be reclaimed. mirrormaker starts
      # in its own step below, only after topics genuinely exist.
      - name: Bring up Cassandra + Kafka (without MirrorMaker 2)
        run: docker compose up -d cassandra-1 cassandra-2 cassandra-3 cassandra-4 kafka-1 kafka-2 kafka-3 kafka-4 prometheus grafana redis

      - name: Wait for Cassandra + Kafka to report healthy
        run: |
          containers="pharos-cassandra-1 pharos-cassandra-2 pharos-cassandra-3 pharos-cassandra-4 pharos-kafka-1 pharos-kafka-2 pharos-kafka-3 pharos-kafka-4 pharos-redis"
          for i in $(seq 1 60); do
            all_healthy=true
            for c in $containers; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || echo "missing")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
              fi
            done
            if [ "$all_healthy" = true ]; then
              echo "Cluster is healthy."
              exit 0
            fi
            echo "Still waiting ($i/60)..."
            sleep 10
          done
          echo "Cluster did not become healthy in time."
          docker compose ps
          docker compose logs --tail 50
          exit 1

      - name: Apply Cassandra schema
        run: |
          for f in migrations/*.cql; do
            echo "Applying $f"
            docker exec -i -e SSL_CERTFILE=/tls/ca-cert.pem pharos-cassandra-1 cqlsh 127.0.0.1 9042 --ssl < "$f"
          done

      - name: Provision Kafka topics
        run: ./scripts/create_topics.sh

      - name: Bring up MirrorMaker 2
        run: |
          docker compose up -d mirrormaker
          sleep 15

      # -p 1 serializes package execution (§2.4, ARCHITECTURE_PROPOSALS.md
      # "Slice 15: Auth & TLS" addendum): running every package's real
      # Cassandra/Kafka integration tests concurrently genuinely OOM-killed a
      # Cassandra node on this project's dev host once TLS was added -- the
      # -race detector's own overhead plus N packages' worth of simultaneous
      # connections/LWT races is real added load this already-tight topology
      # doesn't have headroom for, confirmed by a clean pass once serialized.
      #
      # internal/chaos is excluded here and run as its own separate step
      # below, deliberately: go test ./... executes packages in alphabetical
      # order, which put internal/chaos's disruptive tests (stop/restart a
      # real Cassandra node, apply and heal a real dc-us/dc-eu network
      # partition, §2.4 Slice 23) immediately before internal/consumer's --
      # and even with real readiness checks added to internal/chaos
      # (gossip/schema agreement, a genuine Kafka metadata probe) rather
      # than a fixed sleep, internal/consumer's own real end-to-end test
      # still intermittently hit spurious Cassandra/Kafka timeouts against
      # this project's tightly resource-constrained (~6.3GB) dev topology
      # immediately afterward. Rather than continuing to chase an ever more
      # precise readiness signal for a fundamentally shared-host resource
      # contention problem, running internal/chaos's disruptive tests in
      # their own step -- with nothing sensitive scheduled immediately after
      # them -- removes the ordering hazard entirely instead of merely
      # narrowing its probability.
      - name: go test -race (excluding internal/chaos)
        # RAPID_CHECKS raises pgregory.net/rapid's default 100 generated
        # sequences per property test (§2.4, Slice 22: property-based &
        # deterministic simulation testing) to 5000 -- these tests are pure
        # in-memory Go with no real Cassandra/Kafka calls, so the added
        # exploration is genuinely free relative to this workflow's actual
        # bottleneck (the real-infra integration tests), not a tradeoff
        # against this already-tight topology's headroom.
        run: |
          RAPID_CHECKS=5000 go test -race -count=1 -p 1 $(go list ./... | grep -v '/internal/chaos$')

      - name: go test -race (internal/chaos, run last -- see above)
        run: go test -race -count=1 ./internal/chaos/...

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
