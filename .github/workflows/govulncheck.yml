name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  govulncheck:
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # Take the newest 1.26.x patch, not the runner image's cached one:
          # stdlib fixes (GO-2026-6611..6617 landed in 1.26.9) arrive as patches.
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
