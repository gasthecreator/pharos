version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      # init/autobuild/analyze must stay on matching versions, so every
      # codeql-action sub-action is one group and always moves together.
      codeql-action:
        patterns: ["github/codeql-action/*"]
      actions-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["github/codeql-action/*"]

  # The Dockerfiles in deploy/docker/ share golang:1.26-alpine as their
  # builder stage; Dependabot only sees tags there, so the digest pin is
  # refreshed alongside the tag.
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
