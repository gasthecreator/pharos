# MirrorMaker 2 configuration (§2.1, §2.2, Slice 14: Multi-Region Cassandra
# + Kafka (Simulated)). Runs standalone (connect-mirror-maker.sh), which
# spins up its own single-node Kafka Connect worker embedding the
# MirrorSourceConnector/MirrorCheckpointConnector/MirrorHeartbeatConnector --
# no separate Connect cluster to operate.
#
# Direction is one-way, dc-us -> dc-eu: this simulates a primary region
# replicating to a disaster-recovery region, not an active-active setup,
# which is what this project's own single-writer-per-key model (Central
# Ingestion always writes to its local/primary region) actually needs. A
# bidirectional (dc-eu -> dc-us too) setup would need MM2's loop-prevention
# and topic-renaming machinery for a property this project doesn't have.

clusters = dc-us, dc-eu

# dc-eu is 1 broker, not 3 -- see docker-compose.yml's Kafka section comment
# for the full reasoning (a real, empirically-confirmed 8GB-host memory
# ceiling that got tighter still once TLS was added in Slice 15, and dc-eu
# being a pure MM2 replication target this project's own application logic
# never coordinates LOCAL_QUORUM/ISR against directly is why it's the DC
# trimmed each time more headroom was needed).
dc-us.bootstrap.servers = pharos-kafka-1:19092,pharos-kafka-2:19092,pharos-kafka-3:19092
dc-eu.bootstrap.servers = pharos-kafka-4:19092

# Both clusters' INTERNAL listener (the one these bootstrap.servers use)
# stays PLAINTEXT (§2.4, ARCHITECTURE_PROPOSALS.md "Slice 15: Auth & TLS") --
# only the EXTERNAL, host-exposed listener is TLS. See docker-compose.yml's
# Kafka section comment for why: TLS on INTERNAL was tried and genuinely
# worked, but its memory cost on top of Cassandra's own TLS overhead
# produced real, repeated OOM kills across this already tightly-budgeted
# 10-node topology. INTERNAL never leaves the private Docker network either
# way.

dc-us->dc-eu.enabled = true
dc-eu->dc-us.enabled = false

# Only the two application topics this project actually cares about
# replicating for cross-region DR (§2.3, §2.4) -- not internal Kafka topics,
# not every topic a future feature might add without an explicit decision.
topics = pharos\.events\.adverse|pharos\.events\.dlq
topics.exclude =
groups = .*

# Capped at 1, matching dc-eu's broker count -- these internal MM2 topics
# can land on either side depending on direction/purpose, and a replication
# factor above the smaller cluster's broker count would simply fail topic
# creation there.
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1

# Internal Connect worker state topics (config/offset/status storage) --
# single-node standalone worker, capped at 1 for the same reason as above.
offset.storage.replication.factor = 1
config.storage.replication.factor = 1
status.storage.replication.factor = 1

tasks.max = 1

# Sync topic configs (retention, partitions) and ACLs from source to target
# automatically, so dc-eu's mirrored topics don't need manual provisioning
# via scripts/create_topics.sh (§4) -- MM2 creates and keeps them in sync.
sync.topic.configs.enabled = true
refresh.topics.enabled = true
refresh.topics.interval.seconds = 30

# Faster checkpoint/heartbeat cadence than MM2's defaults (which assume a
# production WAN link, not a fault-injection test that wants to observe
# replication catching up within a test's own timeout budget).
sync.topic.configs.interval.seconds = 10
emit.heartbeats.interval.seconds = 5
emit.checkpoints.interval.seconds = 5
refresh.groups.interval.seconds = 10
