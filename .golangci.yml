version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Reason: an HTTP response write failure means the client went away;
        # there is nothing useful a handler can do about it.
        - (net/http.ResponseWriter).Write
        # Reason: every FlagSet here is created with flag.ExitOnError, so
        # Parse exits the process on error and never returns one.
        - (*flag.FlagSet).Parse
        # Reason: CLI table output to stdout; a write failure on a terminal
        # is not recoverable and not worth checking on every cell.
        - fmt.Fprint(*text/tabwriter.Writer)
        - fmt.Fprintf(*text/tabwriter.Writer)
        - fmt.Fprintln(*text/tabwriter.Writer)
        - (*text/tabwriter.Writer).Flush
  exclusions:
    rules:
      # Reason: in a main() the process is about to exit, so a deferred
      # Close/cancel not running before os.Exit/log.Fatalf is harmless; the
      # alternative (a run() error-return refactor of each command) would
      # change no behavior.
      - path: ^cmd/
        linters:
          - gocritic
        text: "exitAfterDefer"
      # Reason: deferred teardown Close() on a resource that is not relied
      # on for its result is standard Go; scoped to this one message, not to
      # errcheck as a whole.
      - linters:
          - errcheck
        text: "Error return value of .*Close. is not checked"

formatters:
  enable:
    - gofmt
